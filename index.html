<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Cam</title>
<style>
:root{--bg:#fff;--fg:#111;--mu:#8a8a8a;--ln:#e6e6e6}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0b;--fg:#eee;--mu:#777;--ln:#232323}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;
 display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{padding:16px 0 12px;font-weight:600;letter-spacing:.04em}
header span{color:var(--mu);font-weight:400}
main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{max-width:100%;max-height:100%;background:#000;border-radius:6px}
#hint{position:absolute;color:var(--mu);text-align:center}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 10px}
button,label.b{font:inherit;color:var(--fg);background:none;border:1px solid var(--ln);
 border-radius:6px;padding:9px 14px;cursor:pointer}
button:active,label.b:active{background:var(--ln)}
button.on{border-color:var(--fg)}
.rg{display:flex;align-items:center;gap:10px;color:var(--mu);padding:0 0 14px}
.rg input{flex:1;accent-color:var(--fg)}
input[type=file]{display:none}
</style>
</head>
<body>
<header>ASCII <span>cam</span></header>
<main>
  <canvas id="out" width="960" height="540"></canvas>
  <div id="hint">Camera ya Upload dabao</div>
</main>
<nav>
  <button id="cam">Camera</button>
  <button id="flip">Flip</button>
  <label class="b">Upload<input id="file" type="file" accept="video/*,image/*"></label>
  <button id="snap">Save</button>
  <button id="rec">Rec</button>
</nav>
<div class="rg">Detail <input id="cols" type="range" min="40" max="220" value="110"><span id="cv">110</span></div>
<video id="v" playsinline muted loop style="display:none"></video>

<script>
const $ = id => document.getElementById(id);
const v = $('v'), out = $('out'), ctx = out.getContext('2d', {willReadFrequently:false});
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d', {willReadFrequently:true});
const RAMP = " .,:;i1tfLCG08@";
const W = 960;
let cols = 110, facing = 'user', stream = null, el = null, mirror = true, rec = null, chunks = [];

function stopStream(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
function dims(){ return el === v ? [v.videoWidth, v.videoHeight] : el ? [el.naturalWidth, el.naturalHeight] : [0,0]; }
function hint(t){ $('hint').textContent = t; $('hint').style.display = t ? '' : 'none'; }

async function startCam(){
  stopStream(); v.pause(); v.removeAttribute('src');
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:false});
    v.srcObject = stream; await v.play();
    el = v; mirror = facing === 'user'; hint('');
  }catch(e){ hint('Camera allow karo (HTTPS zaroori hai)'); }
}

function loadFile(f){
  if(!f) return;
  stopStream(); mirror = false;
  const url = URL.createObjectURL(f);
  if(f.type.startsWith('image/')){
    const im = new Image(); im.onload = () => { el = im; hint(''); }; im.src = url;
  }else{
    v.srcObject = null; v.src = url; v.play().then(() => { el = v; hint(''); });
  }
}

function frame(){
  requestAnimationFrame(frame);
  const [w, h] = dims();
  if(!w || (el === v && v.readyState < 2)) return;

  const cw = W / cols, ch = cw * 1.9;
  const rows = Math.max(1, Math.floor(h / w * W / ch));
  const H = Math.round(rows * ch);
  if(out.height !== H) out.height = H;
  if(tmp.width !== cols || tmp.height !== rows){ tmp.width = cols; tmp.height = rows; }

  tctx.save();
  if(mirror){ tctx.translate(cols, 0); tctx.scale(-1, 1); }
  tctx.drawImage(el, 0, 0, cols, rows);
  tctx.restore();
  const d = tctx.getImageData(0, 0, cols, rows).data;

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.font = `${ch * 0.95}px monospace`; ctx.textBaseline = 'top';
  const n = RAMP.length - 1;
  for(let y = 0, i = 0; y < rows; y++){
    for(let x = 0; x < cols; x++, i += 4){
      let r = d[i], g = d[i+1], b = d[i+2];
      r = Math.min(255, Math.max(0, (r - 128) * 1.25 + 140));
      g = Math.min(255, Math.max(0, (g - 128) * 1.25 + 140));
      b = Math.min(255, Math.max(0, (b - 128) * 1.25 + 140));
      const l = 0.299 * r + 0.587 * g + 0.114 * b;
      const c = RAMP[Math.floor(l / 255 * n)];
      if(c === ' ') continue;
      ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
      ctx.fillText(c, x * cw, y * ch);
    }
  }
}

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('cam').onclick = startCam;
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };
$('file').onchange = e => loadFile(e.target.files[0]);
$('snap').onclick = () => out.toBlob(b => download(b, 'ascii.png'));
$('cols').oninput = e => { cols = +e.target.value; $('cv').textContent = cols; };
$('rec').onclick = () => {
  const btn = $('rec');
  if(rec){ rec.stop(); return; }
  if(!el || !window.MediaRecorder){ hint('Pehle camera ya video chalao'); return; }
  chunks = [];
  rec = new MediaRecorder(out.captureStream(24));
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => { download(new Blob(chunks, {type:'video/webm'}), 'ascii.webm'); rec = null; btn.classList.remove('on'); btn.textContent = 'Rec'; };
  rec.start(); btn.classList.add('on'); btn.textContent = 'Stop';
};

frame();
</script>
</body>
</html>
