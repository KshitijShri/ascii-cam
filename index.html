<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ASCII Cam</title>
<style>
:root{--bg:#000;--fg:#fff;--mu:#9a9a9a;--ln:#2a2a2a;--pn:#0d0d0d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,label,select{font:inherit;color:inherit;cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr.on{display:flex;animation:in .45s both}
@keyframes in{from{opacity:0}}
.pg{width:100%;max-width:1040px;margin:0 auto;padding:0 22px}
.nav,.bar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--ln)}
.brand{font-weight:800;letter-spacing:.16em}.brand b{color:var(--mu);font-weight:400}
.nl{color:var(--mu);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:none;border-radius:10px;padding:10px 16px;font-weight:600;transition:.2s}
.btn:hover{border-color:var(--fg)}
.pri{background:var(--fg);color:#000;border-color:var(--fg)}.pri:hover{background:#ddd}
.row{display:flex;flex-wrap:wrap;gap:10px}
